name: Build release zip

# Fires only when a Release is actually published (or when you manually
# re-run it) — never on a plain push/PR to main. This is the workflow that
# turns a GitHub Release into what sites' Plugin Update Checker instance
# actually downloads; see includes/woo-wallet-update-checker.php.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach the built zip to (defaults to the latest release)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (default ref, just to get `gh` working)
        uses: actions/checkout@v4

      - name: Resolve target tag
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -e
          if [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          elif [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          else
            TAG="$(gh release view --json tagName -q .tagName)"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Checkout the release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.target.outputs.tag }}

      - name: Assemble a clean plugin package
        run: |
          set -e
          PLUGIN_SLUG="woo-wallet"
          STAGE_DIR="/tmp/${PLUGIN_SLUG}"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          # Copy everything, then strip dev-only files. build/ and
          # includes/libraries/ (the bundled update checker) are genuine
          # runtime dependencies and must ship; vendor/, tests/wp-content/
          # etc. never get committed in the first place (see .gitignore).
          rsync -a --exclude-from=- ./ "$STAGE_DIR"/ <<'EOF'
          .git/
          .github/
          .gitignore
          composer.json
          composer.lock
          docs/
          phpunit.xml.dist
          tests/
          EOF

          cd /tmp
          zip -r "${PLUGIN_SLUG}.zip" "${PLUGIN_SLUG}" -x '*.DS_Store'

      - name: Upload the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.target.outputs.tag }}" \
            "/tmp/woo-wallet.zip" \
            --repo "${{ github.repository }}" \
            --clobber
